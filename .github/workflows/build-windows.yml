name: build-windows-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Keep in sync with requires-python in pyproject.toml.
      - name: Install Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync

      # NOTE: PyInstaller cannot cross-compile; the .exe must be built
      # on a Windows runner (this job) or a local Windows machine.
      - name: Build .exe with PyInstaller
        run: uv run pyinstaller --onefile --noconsole --name cuenta-paginas-pdf main.py

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuenta-paginas-pdf-windows
          path: dist/cuenta-paginas-pdf.exe